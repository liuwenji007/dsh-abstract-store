name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dev dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Validate catalog data
        run: npm run validate
      - name: Rebuild the browser artifact
        run: npm run build
      - name: The committed artifact must match a fresh build
        run: git diff --exit-code -- client.js
      - name: Syntax check
        run: node --check client.js
